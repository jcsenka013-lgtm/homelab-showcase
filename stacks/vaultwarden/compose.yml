# Vaultwarden password manager.
# Mesh HTTPS via scripts/tailscale-serve; LAN HTTPS via Caddy (tls internal).
# Plain HTTP on the published port is for the Caddy upstream only.
# ADMIN_TOKEN in .env next to this file (not in git). Admin page: /admin
#
# Caddy's data dir holds its internal CA. Keep it when moving hosts, or every
# device that trusted the old root has to trust a new one.
name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set in .env}
      DOMAIN: ${VAULTWARDEN_DOMAIN:?set in .env}
    volumes:
      - /DATA/AppData/vaultwarden/data:/data
    ports:
      - "${VAULTWARDEN_HTTP_PORT:-8088}:80"

  vw-caddy:
    image: caddy:2-alpine
    container_name: vw-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /DATA/AppData/vw-caddy/config:/config
      - /DATA/AppData/vw-caddy/data:/data
