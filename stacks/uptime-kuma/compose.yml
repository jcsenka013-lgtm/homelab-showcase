# Uptime Kuma availability checks.
# SQLite must stay on local disk (network shares cause permission and log storms).
name: uptime-kuma
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - /DATA/AppData/uptime-kuma:/app/data
