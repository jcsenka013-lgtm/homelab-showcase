# Immich photo library.
# Upload / library paths may point at a separate NAS or at /srv/pool.
# Postgres data and the ML model cache stay local under /DATA/AppData/immich.
# DB_PASSWORD in .env next to this file (not in git).
name: immich

x-db-env: &db-env
  DB_HOSTNAME: immich_postgres
  DB_USERNAME: postgres
  DB_PASSWORD: ${DB_PASSWORD:?set in .env}
  DB_DATABASE_NAME: immich
  REDIS_HOSTNAME: immich_redis

services:
  immich_server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    volumes:
      - ${IMMICH_UPLOAD:-/srv/pool/photos}:/usr/src/app/upload
      - ${IMMICH_EXTERNAL_ORIGINALS:-/srv/pool/photo-originals}:/Originals:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      <<: *db-env
      IMMICH_MACHINE_LEARNING_URL: http://immich_machine_learning:3003
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    depends_on:
      - immich_redis
      - immich_postgres
    restart: unless-stopped

  immich_machine_learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    # Optional: set runtime to nvidia and deploy.resources for GTX 10-series acceleration.
    volumes:
      - /DATA/AppData/immich/model-cache:/cache
      - ${IMMICH_EXTERNAL_ORIGINALS:-/srv/pool/photo-originals}:/Originals:ro
    environment:
      <<: *db-env
    restart: unless-stopped

  immich_redis:
    container_name: immich_redis
    image: redis:7-alpine
    restart: unless-stopped

  immich_postgres:
    container_name: immich_postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    shm_size: "512mb"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /DATA/AppData/immich/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
