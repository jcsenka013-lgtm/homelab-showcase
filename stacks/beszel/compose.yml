# Beszel hub (system monitoring UI).
# data/ holds the hub's keypair; agents trust the public half (see beszel-agent).
name: beszel
services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "${BESZEL_PORT:-8090}:8090"
    volumes:
      - /DATA/AppData/beszel/data:/beszel_data
    environment:
      - PORT=8090
