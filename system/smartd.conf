# /etc/smartd.conf, installed by `sudo scripts/server-prep alerts`.
# Every SMART-capable disk (HDDs, SSD, NVMes; -d removable skips optical USB):
#   -a                 watch health, error logs, failed self-tests, bad-sector counts
#   -o on -S on        enable the drive's own offline tests and attribute autosave
#   -n standby,q       don't spin up a sleeping HDD just to check it
#   -s ...             short self-test daily 02:00, long one Saturdays 05:00
#   -M daily           repeat a warning once a day until it's fixed, not just once
#   -m root -M exec    no mail: hand each warning to smartd-ntfy → ntfy
DEVICESCAN -d removable -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/05) -m root -M daily -M exec /usr/local/sbin/smartd-ntfy
